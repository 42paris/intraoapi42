name: Verify and release monorepo packages

on:
  pull_request:
    paths:
      - 'specs/**'
      - 'clients/**'
      - 'openapi/**'
      - 'tool/generate_indexes.py'
      - '.github/workflows/release.yaml'
  push:
    branches:
      - main
    paths:
      - 'specs/**'
      - 'clients/**'
      - 'openapi/**'
      - 'tool/generate_indexes.py'
      - '.github/workflows/release.yaml'

permissions:
  contents: read

concurrency:
  group: verify-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify generated files
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run pipeline and check for drift
        run: make ci-check

  release:
    name: Release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install root dependencies
        run: npm ci

      - name: Release API contract
        id: release-openapi
        working-directory: openapi
        run: npx --no-install semantic-release -e semantic-release-monorepo
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Release Go
        working-directory: clients/go
        run: npx --no-install semantic-release -e semantic-release-monorepo
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

    # !WARN: Comment until python organization is created
    #   - name: Release Python
    #     working-directory: clients/python
    #     run: npx --no-install semantic-release -e semantic-release-monorepo
    #     env:
    #       GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
    #       PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Release TypeScript
        working-directory: clients/typescript
        run: npm ci && npx semantic-release -e semantic-release-monorepo
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
