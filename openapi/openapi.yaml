openapi: 3.1.2
info:
  title: Intra 42 API
  description: |
    OpenAPI specification for the Intra 42 API v2.

    ## Legend

    - 🔑 — Restricted call. Requires an elevated staff role and/or an application scope beyond `public`.
    - 👤 — Restricted to the authenticated resource owner. Only accessible with a token belonging to the user whose data is being accessed.

    Some fields within an otherwise accessible response may also be conditionally restricted; these are flagged individually in the field's description rather than in the operation summary.
  version: 1.0.0
servers:
  - url: https://api.intra.42.fr/v2
    description: Production
  - url: https://api.intra-staging.42.fr/v2
    description: Staging
