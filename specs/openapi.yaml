openapi: 3.1.2

info:
  title: Intra 42 API
  description: |
    OpenAPI specification for the Intra 42 API v2.

    ## Legend

    - 🔑 — Restricted call. Requires an elevated staff role and/or an application scope beyond `public`.
    - 👤 — Restricted to the authenticated resource owner. Only accessible with a token belonging to the user whose data is being accessed.

    Some fields within an otherwise accessible response may also be conditionally restricted; these are flagged individually in the field's description rather than in the operation summary.
  version: 1.0.0


servers:
  - url: https://api.intra.42.fr/v2
    description: Production
  - url: https://api.intra-staging.42.fr/v2
    description: Staging

components:
  schemas:
    $ref: "./schemas/_index.yaml"

  parameters:
    $ref: "./parameters/_index.yaml"

  headers:
    Link:
      description: |
        RFC5988 Web Linking header containing `first`, `prev`, `next` and `last` links when available.
        Example: <https://api.intra.42.fr/v2/Users?page=2>; rel="next", <https://api.intra.42.fr/v2/Users?page=1>; rel="prev"
      schema:
        type: string
    X-Page:
      description: The current page number.
      schema:
        type: integer
    X-Per-Page:
      description: The current pagination length (items per page).
      schema:
        type: integer
    X-Total:
      description: The total number of pages available for the resource.
      schema:
        type: integer

  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authentication using Bearer tokens.
      flows:
        clientCredentials:
          tokenUrl: https://api.intra.42.fr/v2/oauth/token
          scopes: &oauthScopes
            public: Access the user's public data
            projects: Manage teams, slots and all projects-related stuff
            profile: Manage user data
            elearning: Manage media-related stuff
            tig: Manage community services
            forum: Manage topics and messages
        authorizationCode:
          authorizationUrl: https://api.intra.42.fr/v2/oauth/authorize
          tokenUrl: https://api.intra.42.fr/v2/oauth/token
          scopes: *oauthScopes

paths:
  $ref: "./paths/_index.yaml"
