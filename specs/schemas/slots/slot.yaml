Slot:
  type: object
  properties:
    id:
      type: integer
    begin_at:
      type: string
      format: date-time
      x-go-type: IntraTime
    end_at:
      type: string
      format: date-time
      x-go-type: IntraTime
    scale_team_id:
      type: [integer, "null"]
    user:
      $ref: "#/components/schemas/LightUser"
    created_at:
      type: string
      format: date-time
      x-go-type: IntraTime
  required:
    - id
    - begin_at
    - end_at
