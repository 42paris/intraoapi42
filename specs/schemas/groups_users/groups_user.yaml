GroupsUser:
  type: object
  properties:
    id:
      type: integer
    group_id:
      type: integer
    user_id:
      type: integer
    created_at:
      type: string
      format: date-time
      x-go-type: IntraTime
    updated_at:
      type: string
      format: date-time
      x-go-type: IntraTime
    user:
      $ref: "#/components/schemas/UserPreview"
    group:
      $ref: "#/components/schemas/Group"
  required:
    - id
    - group_id
    - user_id
