/closes:
  get:
    operationId: getCloses
    summary: Get a list of closes
    security:
      - OAuth2:
          - public
    parameters:
      - name: sort
        in: query
        description: |
          The sort field. Sorted by created_at desc, id desc by default.
          Must be one of: id, user_id, closer_id, reason, state, created_at, updated_at, kind, end_at, jid.
        required: false
        schema:
          type: string
          enum:
            [
              id,
              user_id,
              closer_id,
              reason,
              state,
              created_at,
              updated_at,
              kind,
              end_at,
              jid,
            ]
      - name: filter
        in: query
        description: |
          Filtering on one or more fields. Must be one of: id, user_id, closer_id, reason, state, created_at, updated_at, kind, end_at, jid, campus_id, end.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - name: range
        in: query
        description: |
          Select on a particular range. Must be one of: id, user_id, closer_id, reason, state, created_at, updated_at, kind, end_at, jid.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of closes
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/CloseResponse"
      default:
        $ref: "#/components/responses/ErrorResponse"
