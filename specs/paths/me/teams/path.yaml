/me/teams:
  get:
    operationId: GetTeamsByMe
    tags:
      - Teams
    summary: Get a list of teams by me
    security:
      - OAuth2:
        - public
    parameters:
      - $ref: "#/components/parameters/base_sort"
        description: |
          The sort field. Sorted by id asc by default.
          Must be one of: id, project_id, name, created_at, updated_at, locked_at, closed_at, final_mark, repo_url, repo_uuid, deadline_at, terminating_at, project_session_id, status.
      - $ref: "#/components/parameters/base_filter"
        description: |
          Filtering on one or more fields.
          Must be one of: id, project_id, name, created_at, updated_at, locked_at, closed_at, final_mark, repo_url, repo_uuid, deadline_at, terminating_at, project_session_id, status, cursus, active_cursus, campus, primary_campus, locked, closed, deadline, terminating, with_mark.
      - $ref: "#/components/parameters/base_range"
        description: |
          Select on a particular range.
          Must be one of: id, project_id, name, created_at, updated_at, locked_at, closed_at, final_mark, repo_url, repo_uuid, deadline_at, terminating_at, project_session_id, status.
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      '200':
        description: A list of teams
        headers:
          Link:
            $ref: '#/components/headers/Link'
          X-Page:
            $ref: '#/components/headers/X-Page'
          X-Per-Page:
            $ref: '#/components/headers/X-Per-Page'
          X-Total:
            $ref: '#/components/headers/X-Total'
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/LightTeam'
      default:
        $ref: '#/components/responses/ErrorResponse'
