/users/{user_id}/projects_users:
  get:
    operationId: getProjectsUsersByUserId
    tags:
      - Projects Users
    summary: Get a list of projects users by a user Id
    security:
      - OAuth2:
        - public
    parameters:
      - name: user_id
        in: path
        required: true
        description: The ID of the user
        schema:
          type: string
      - $ref: "#/components/parameters/base_filter"
        description: |
          Filtering on one or more fields. Must be one of: id, project_id, user_id, created_at, updated_at, occurrence, final_mark, retriable_at, marked_at, status, cursus, campus, retriable, marked.
      - $ref: "#/components/parameters/base_range"
        description: |
          Select on a particular range. Must be one of: id, project_id, user_id, created_at, updated_at, occurrence, final_mark, retriable_at, marked_at, status.
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      '200':
        description: A list of projects users
        headers:
          Link:
            $ref: '#/components/headers/Link'
          X-Page:
            $ref: '#/components/headers/X-Page'
          X-Per-Page:
            $ref: '#/components/headers/X-Per-Page'
          X-Total:
            $ref: '#/components/headers/X-Total'
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ProjectUser'
      default:
        $ref: '#/components/responses/ErrorResponse'
