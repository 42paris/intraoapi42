/users/{user_id}/notes:
  get:
    operationId: GetNotesByUserId
    tags:
      - Notes
    summary: 👤 Get a list of notes by a user Id
    security:
      - OAuth2:
        - public
    x-roles-scoped:
      - Notes manager
      - Advanced notes manager
    parameters:
      - name: user_id
        in: path
        required: true
        description: The ID of the user
        schema:
          type: string
      - $ref: "#/components/parameters/base_sort"
        description: |
          The sort field. Sorted by id asc by default.
          Must be one of: id, user_id, from, subject, content, created_at, updated_at, kind, approved_at, approver_id, from_user_id.
      - $ref: "#/components/parameters/base_filter"
        description: |
          Filtering on one or more fields.
          Must be one of: id, user_id, from, subject, content, created_at, updated_at, kind, approved_at, approver_id, from_user_id, approved.
      - $ref: "#/components/parameters/base_range"
        description: |
          Select on a particular range.
          Must be one of: id, user_id, from, subject, content, created_at, updated_at, kind, approved_at, approver_id, from_user_id.
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      '200':
        description: A list of notes
        headers:
          Link:
            $ref: '#/components/headers/Link'
          X-Page:
            $ref: '#/components/headers/X-Page'
          X-Per-Page:
            $ref: '#/components/headers/X-Per-Page'
          X-Total:
            $ref: '#/components/headers/X-Total'
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/LightNote'
      default:
        $ref: '#/components/responses/ErrorResponse'
        