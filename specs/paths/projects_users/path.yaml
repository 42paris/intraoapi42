/projects_users:
  get:
    operationId: getProjectsUsers
    tags:
      - Projects Users
    summary: Get a list of projects users
    security:
      - OAuth2:
        - public
    parameters:
      - $ref: "#/components/parameters/base_filter"
        description: |
          Filtering on one or more fields. Must be one of: id, project_id, user_id, created_at, updated_at, occurrence, final_mark, retriable_at, marked_at, status, cursus, campus, retriable, marked.
      - $ref: "#/components/parameters/base_range"
        description: |
          Select on a particular range. Must be one of: id, project_id, user_id, created_at, updated_at, occurrence, final_mark, retriable_at, marked_at, status.
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      '200':
        description: A list of projects users
        headers:
          Link:
            $ref: '#/components/headers/Link'
          X-Page:
            $ref: '#/components/headers/X-Page'
          X-Per-Page:
            $ref: '#/components/headers/X-Per-Page'
          X-Total:
            $ref: '#/components/headers/X-Total'
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ProjectUser'
      default:
        $ref: '#/components/responses/ErrorResponse'
  post:
    operationId: PostProjectsUsers
    tags:
      - Projects Users
    summary: Create a project user
    security:
      - OAuth2:
          - public
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - projects_user
            properties:
              projects_user:
                $ref: "#/components/schemas/ProjectUserCreate"
    responses:
      "201":
        description: Project user created successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUser"
      "400":
        $ref: '#/components/responses/ErrorResponse'
      default:
        $ref: '#/components/responses/ErrorResponse'